<div class="auth-container" *ngIf="!showlogin">
    <div class="auth-card">
        <h2>User SignUp</h2>
        <form #userForm="ngForm" (ngSubmit)="onSignUp(userForm.value)">
            <div class="form-group">
                <label> Name</label>
                <input type="text" #name="ngModel" required placeholder="enter your name" name="name" ngModel>
                <span *ngIf="name?.invalid && name?.touched" style="color: red;"> Name is required</span>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" #email="ngModel" email required placeholder="enter your email" name="email" ngModel>
                <span *ngIf="email?.invalid && email?.touched" style="color: red;"> Email is required</span>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" minlength="6" pattern="[a-zA-Z0-9.\s@#$_-]+" #password="ngModel" required
                    placeholder="enter your password" name="password" ngModel>
                <span *ngIf="password?.invalid && password?.touched" style="color: red;"> Password is required</span>
            </div>
            <button type="submit" class="submit-btn" [disabled]="userForm.invalid">Sign Up</button>
            <p>Already have an acount?<a (click)="OpenLogin()">Click to Log in</a></p>
        </form>
    </div>
</div>

<!-- log in form -->

<div class="auth-container" *ngIf="showlogin">
    <div class="auth-card">
        <h2>User Login</h2>
        <form #loginform="ngForm" (ngSubmit)="onLogIn(loginform.value)">
            <p>{{authError}}</p>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" #email="ngModel" email required placeholder="enter your email" name="email" ngModel>
                <span *ngIf="email?.invalid && email?.touched" style="color: red;"> Email is required</span>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" minlength="6" pattern="[a-zA-Z0-9.\s@#$_-]+" #password="ngModel" required
                    placeholder="enter your password" name="password" ngModel>
                <span *ngIf="password?.invalid && password?.touched" style="color: red;"> Password is required</span>
            </div>
            <button type="submit" class="submit-btn" [disabled]="loginform.invalid">Log In</button>
            <p>Don't have an acoount?<a (click)="Opensignup()">Click to Sign up</a></p>
        </form>
    </div>
</div>
