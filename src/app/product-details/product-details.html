<div class="container my-5">
  @if (productData) {
    <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
      <div class="row g-0">

        <!-- Product Image -->
        <div class="col-md-5 bg-light p-4 text-center d-flex align-items-center justify-content-center">
          <img [src]="productData.image" [alt]="productData.name" class="img-fluid rounded-3 object-fit-contain"
            style="max-height: 380px;">
        </div>

        <!-- Product details -->
        <div class="col-md-7 p-4 p-md-5 d-flex flex-column justify-content-between">
          <div>
            <h2 class="fw-bold text-dark mb-2">{{ productData.name }}</h2>

            <div class="mb-3">
              <span class="text-success fw-bold display-6">₹{{ productData.price }}</span>
            </div>

            <div class="mb-4">
              <span class="rounded-circle d-inline-block border shadow-sm"
                [style.backgroundColor]="productData.color?.toLowerCase()"
                style="width: 32px; height: 32px;">
              </span>
            </div>

            <p class="text-secondary fs-6 mb-4">
              <strong>Description:</strong> {{ productData.description }}
            </p>

            <!-- Quantity Selector -->
            <div class="mb-4">
              <label class="fw-bold mb-2">Quantity:</label>
              <div class="d-flex align-items-center">
                <button class="btn btn-outline-secondary px-3" (click)="handleQuantity('min')">-</button>
                <input type="text" class="form-control text-center mx-2" [value]="productQuantity" readonly
                  style="width: 60px;">
                <button class="btn btn-outline-secondary px-3" (click)="handleQuantity('plus')">+</button>
              </div>
            </div>
          </div>

          <!-- Buttons -->
          <div class="d-grid gap-2 d-md-flex justify-content-md-start mt-3">
            @if(!removecart){
            <button (click)="AddToCart()" class="btn btn-warning btn-lg px-4 me-md-2 fw-bold shadow-sm">
              Add to Cart
            </button>
            }@else{
            <button (click)="RemovefromCart(productData.id)" class="btn btn-warning btn-lg px-4 me-md-2 fw-bold shadow-sm">
              Remove from Cart
            </button>
            }
            <button class="btn btn-success btn-lg px-4 fw-bold shadow-sm">
              Buy Now
            </button>
          </div>

        </div>

      </div>
    </div>
  } 
  @else {
    <div class="text-center my-5 p-5 bg-light rounded-4 shadow-sm">
      <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Loading...</span>
      </div>
      <h4 class="fw-bold text-dark">Loading Product Details...</h4>
    </div>
  }
</div>
