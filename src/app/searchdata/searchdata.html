<div class="container my-4">
    @if(searchDetails && searchDetails.length > 0){
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
        @for(item of searchDetails; track item.id){
        <div class="col">
            <div class="card h-100 shadow-sm border-1">
                <div class="text-center p-3" style="height: 200px;">
                    <a [routerLink]="['/details', item.id]"><img [src]="item.image" [alt]="item.name" class="img-fluid h-100 object-fit-contain"></a>
                </div>
                <div class="card-body d-flex flex-column justify-content-between border-top">
                    <div>
                        <h6 class="card-title text-truncate fw-bold mb-2" [title]="item.name">{{item.name}}</h6>

                        <p class="card-text mb-1">
                            <span class="fw-bold text-success fs-5">₹{{item.price}}</span>
                        </p>

                        <p class="card-text mb-2 text-muted small">
                            <strong>Color:</strong> {{item.color}}
                        </p>

                        <p class="card-text text-secondary small text-truncate" [title]="item.description">
                            <strong>Desc:</strong> {{item.description}}
                        </p>
                    </div>
                    <div class="mt-3">
                        <a [routerLink]="['/details', item.id]" class="btn btn-primary btn-sm w-100">
                            View Details
                        </a>
                    </div>
                </div>
            </div>
        </div>
        }
    </div>
    }
    @else {
    <div class="text-center my-5 p-5 bg-light rounded-3 shadow-sm">
      <i class="bi bi-exclamation-circle text-warning display-4 mb-3"></i>
      <h3 class="fw-bold text-dark">No Products Found</h3>
      <p class="text-muted">Result Not Found</p>
    </div>
  }
</div>
